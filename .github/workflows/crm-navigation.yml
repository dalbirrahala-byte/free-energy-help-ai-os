name: CRM Navigation Guard

on:
  pull_request:
    paths:
      - "frontend/src/app/customers/**"
      - "frontend/src/app/leads/**"
      - "frontend/src/components/leads/**"
      - "frontend/src/components/layout/AppShell.tsx"
      - "frontend/src/lib/navigation/**"
      - "frontend/package.json"
      - ".github/workflows/crm-navigation.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/src/app/customers/**"
      - "frontend/src/app/leads/**"
      - "frontend/src/components/leads/**"
      - "frontend/src/components/layout/AppShell.tsx"
      - "frontend/src/lib/navigation/**"
      - "frontend/package.json"
      - ".github/workflows/crm-navigation.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:crm-navigation
      - run: npm run test:auth
      - run: npm run typecheck
      - run: npm run lint:ci
